<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Hex Blast（六角 / ドラッグ配置）</title>
  <style>
    :root{
      --bg:#0b1020;
      --text:#e9eeff;
      --muted:#93a0c7;
      --shadow: rgba(0,0,0,.35);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{
      height:100%; margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    }
    body{ overscroll-behavior:none; touch-action:none; user-select:none; }

    #app{
      height:100%;
      display:flex;
      flex-direction:column;
      padding: calc(10px + var(--safe-t)) 10px calc(10px + var(--safe-b)) 10px;
      gap:10px;
    }

    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 12px;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      box-shadow:0 8px 20px var(--shadow);
    }
    .title{ display:flex; flex-direction:column; gap:2px; min-width:0; }
    .title b{ font-size:14px; letter-spacing:.2px; }
    .title span{ font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .stats{ display:flex; gap:10px; align-items:center; font-variant-numeric:tabular-nums; }
    .pill{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      border-radius:999px;
      padding:8px 10px;
      font-size:12px;
      display:flex; gap:6px; align-items:baseline;
    }
    .pill .k{ color:var(--muted); font-size:11px; }
    .pill .v{ font-weight:700; }

    button{
      appearance:none; border:none;
      background:rgba(110,231,255,.18);
      color:var(--text);
      border:1px solid rgba(110,231,255,.35);
      padding:10px 12px;
      border-radius:12px;
      font-weight:700; font-size:12px;
      box-shadow:0 8px 20px var(--shadow);
    }
    button:active{ transform:translateY(1px); }

    .stage{ flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; }
    .boardWrap{
      flex:1; min-height:0;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      box-shadow:0 12px 26px var(--shadow);
      position:relative;
      overflow:hidden;
    }
    canvas{ width:100%; height:100%; display:block; }

    .tray{
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      box-shadow:0 12px 26px var(--shadow);
      padding:10px;
      display:flex; gap:10px;
      align-items:stretch; justify-content:space-between;
    }
    .slot{
      flex:1;
      background:rgba(0,0,0,.20);
      border:1px dashed rgba(255,255,255,.16);
      border-radius:14px;
      position:relative; overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      min-height:88px;
      touch-action:none;
    }
    .slot small{
      position:absolute; left:10px; top:8px;
      color:var(--muted); font-size:10px; letter-spacing:.2px;
    }
    .hint{ font-size:12px; color:var(--muted); text-align:center; padding:2px 6px; }

    /* Drag ghost */
    #ghost{
      position:fixed;
      left:0; top:0;
      width:140px; height:140px;
      pointer-events:none;
      z-index:9999;
      display:none;
      filter: drop-shadow(0 14px 20px rgba(0,0,0,.45));
      transform: translate(-9999px,-9999px);
    }
    #ghost canvas{ width:100%; height:100%; }

    /* Overlay */
    .overlay{
      position:absolute; inset:0;
      display:none;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 5;
      padding:20px;
    }
    .overlay.show{ display:flex; }
    .card{
      width:min(420px, 92vw);
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:16px;
      box-shadow:0 18px 40px var(--shadow);
    }
    .card h2{ margin:0 0 6px 0; font-size:16px; }
    .card p{ margin:6px 0; color:var(--muted); font-size:13px; line-height:1.5; }
    .row{ display:flex; gap:10px; margin-top:12px; }
    .row button{ flex:1; }
    .danger{ background:rgba(255,107,138,.16); border-color:rgba(255,107,138,.40); }
  </style>
</head>

<body>
<div id="app">
  <div class="topbar">
    <div class="title">
      <b>Hex Blast</b>
      <span>指ではなく「狙い点（ゴースト）」でハイライト</span>
    </div>
    <div class="stats">
      <div class="pill"><span class="k">SCORE</span><span class="v" id="score">0</span></div>
      <div class="pill"><span class="k">COMBO</span><span class="v" id="combo">0</span></div>
      <button id="restartBtn">リスタート</button>
    </div>
  </div>

  <div class="stage">
    <div class="boardWrap" id="boardWrap">
      <canvas id="board"></canvas>

      <div class="overlay" id="overlay">
        <div class="card">
          <h2 id="ovTitle">ゲームオーバー</h2>
          <p id="ovText">置ける場所がありません。リスタートしますか？</p>
          <div class="row">
            <button class="danger" id="ovRestart">リスタート</button>
            <button id="ovClose">閉じる</button>
          </div>
        </div>
      </div>
    </div>

    <div class="tray" id="tray">
      <div class="slot" data-slot="0"><small>PIECE 1</small><canvas class="pc" width="200" height="120"></canvas></div>
      <div class="slot" data-slot="1"><small>PIECE 2</small><canvas class="pc" width="200" height="120"></canvas></div>
      <div class="slot" data-slot="2"><small>PIECE 3</small><canvas class="pc" width="200" height="120"></canvas></div>
    </div>
    <div class="hint" id="hint">ピースをドラッグして配置（ハイライトはゴースト基準）</div>
  </div>
</div>

<!-- drag ghost -->
<div id="ghost"><canvas id="ghostCanvas" width="200" height="200"></canvas></div>

<script>
(() => {
  // ===== iPhone: スクロール/ピンチ抑止 =====
  const prevent = (e) => { e.preventDefault(); };
  document.addEventListener('touchmove', prevent, { passive:false });
  document.addEventListener('gesturestart', prevent, { passive:false });
  document.addEventListener('gesturechange', prevent, { passive:false });
  document.addEventListener('gestureend', prevent, { passive:false });

  // ===== 盤面（小さめ）=====
  const RADIUS = 4;
  const keyOf = (q,r) => `${q},${r}`;
  const dirs = [
    {q: 1, r: 0}, {q: 1, r:-1}, {q: 0, r:-1},
    {q:-1, r: 0}, {q:-1, r: 1}, {q: 0, r: 1}
  ];
  function inBoard(q,r){
    const s = -q - r;
    return (Math.abs(q) <= RADIUS && Math.abs(r) <= RADIUS && Math.abs(s) <= RADIUS);
  }
  function allCells(){
    const arr = [];
    for(let q=-RADIUS; q<=RADIUS; q++){
      for(let r=-RADIUS; r<=RADIUS; r++){
        if(inBoard(q,r)) arr.push({q,r});
      }
    }
    return arr;
  }
  const cells = allCells();

  // ===== DOM =====
  const boardWrap = document.getElementById('boardWrap');
  const boardCanvas = document.getElementById('board');
  const bctx = boardCanvas.getContext('2d');

  const tray = document.getElementById('tray');
  const slotEls = [...tray.querySelectorAll('.slot')];
  const pieceCanvases = [...tray.querySelectorAll('canvas.pc')].map(c => ({el:c, ctx:c.getContext('2d')}));

  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const hintEl = document.getElementById('hint');

  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovRestart = document.getElementById('ovRestart');
  const ovClose = document.getElementById('ovClose');

  const restartBtn = document.getElementById('restartBtn');

  // Ghost
  const ghost = document.getElementById('ghost');
  const ghostCanvas = document.getElementById('ghostCanvas');
  const gctx = ghostCanvas.getContext('2d');

  // ===== Geometry =====
  let geom = { hexSize: 18, originX: 0, originY: 0, cellToPix: new Map(), pixToCell: null };

  function axialToPixelLocal(q,r, size){
    const SQ3 = Math.sqrt(3);
    return { x: size * SQ3 * (q + r/2), y: size * 1.5 * r };
  }
  function axialRound(q,r){
    let x=q, z=r, y=-x-z;
    let rx=Math.round(x), ry=Math.round(y), rz=Math.round(z);
    const x_diff=Math.abs(rx-x), y_diff=Math.abs(ry-y), z_diff=Math.abs(rz-z);
    if (x_diff > y_diff && x_diff > z_diff) rx = -ry - rz;
    else if (y_diff > z_diff) ry = -rx - rz;
    else rz = -rx - ry;
    return {q: rx, r: rz};
  }
  function hexPath(ctx, x, y, size){
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a = (Math.PI/180) * (60*i - 30);
      const px = x + size * Math.cos(a);
      const py = y + size * Math.sin(a);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }

  function computeSizeAndOrigin(rect){
    const pad = 18;
    const W = rect.width - pad*2;
    const H = rect.height - pad*2;
    const SQ3 = Math.sqrt(3);

    let size = Math.floor(Math.min(W/(SQ3*3*RADIUS), H/(3*RADIUS)) * 0.98);
    size = Math.max(10, size);

    for(let iter=0; iter<8; iter++){
      let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
      for(const c of cells){
        const p = axialToPixelLocal(c.q,c.r,size);
        minX = Math.min(minX,p.x); maxX = Math.max(maxX,p.x);
        minY = Math.min(minY,p.y); maxY = Math.max(maxY,p.y);
      }
      const half = size;
      const localCx = (minX + maxX)/2;
      const localCy = (minY + maxY)/2;
      const originX = rect.width/2 - localCx;
      const originY = rect.height/2 - localCy;

      const left   = originX + minX - half;
      const right  = originX + maxX + half;
      const top    = originY + minY - half;
      const bottom = originY + maxY + half;

      const ok = (left >= pad) && (right <= rect.width - pad) && (top >= pad) && (bottom <= rect.height - pad);
      if(ok) return {size, originX, originY};

      size = Math.floor(size * 0.94);
      if(size < 10) size = 10;
    }

    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for(const c of cells){
      const p = axialToPixelLocal(c.q,c.r,size);
      minX = Math.min(minX,p.x); maxX = Math.max(maxX,p.x);
      minY = Math.min(minY,p.y); maxY = Math.max(maxY,p.y);
    }
    const localCx = (minX + maxX)/2, localCy = (minY + maxY)/2;
    return {size, originX: rect.width/2 - localCx, originY: rect.height/2 - localCy};
  }

  function resizeBoard(){
    const rect = boardWrap.getBoundingClientRect();
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    boardCanvas.width = Math.floor(rect.width * dpr);
    boardCanvas.height = Math.floor(rect.height * dpr);
    bctx.setTransform(dpr,0,0,dpr,0,0);

    const fit = computeSizeAndOrigin(rect);
    geom.hexSize = fit.size;
    geom.originX = fit.originX;
    geom.originY = fit.originY;

    geom.cellToPix = new Map();
    for(const c of cells){
      const pL = axialToPixelLocal(c.q,c.r, geom.hexSize);
      geom.cellToPix.set(keyOf(c.q,c.r), { x: geom.originX + pL.x, y: geom.originY + pL.y });
    }

    geom.pixToCell = (x,y) => {
      const size = geom.hexSize;
      const SQ3 = Math.sqrt(3);
      const q = (SQ3/3 * x - 1/3 * y) / size;
      const r = (2/3 * y) / size;
      const c = axialRound(q,r);
      if(!inBoard(c.q,c.r)) return null;
      return c;
    };

    draw();
    drawTray();
  }

  // ===== Game state =====
  let occupied = new Map();
  let score = 0;
  let combo = 0;

  const PATTERNS = [
    [{q:0,r:0}],
    [{q:0,r:0},{q:1,r:0}],
    [{q:0,r:0},{q:0,r:1}],
    [{q:0,r:0},{q:1,r:-1}],
    [{q:0,r:0},{q:1,r:0},{q:0,r:1}],
    [{q:0,r:0},{q:1,r:0},{q:1,r:-1}],
    [{q:0,r:0},{q:0,r:1},{q:-1,r:1}],
    [{q:0,r:0},{q:1,r:0},{q:2,r:0}],
    [{q:0,r:0},{q:0,r:1},{q:0,r:2}],
    [{q:0,r:0},{q:1,r:-1},{q:2,r:-2}],
    [{q:0,r:0},{q:1,r:0},{q:2,r:0},{q:3,r:0}],
    [{q:0,r:0},{q:0,r:1},{q:0,r:2},{q:0,r:3}],
    [{q:0,r:0},{q:1,r:0},{q:0,r:1},{q:-1,r:1}],
    [{q:0,r:0},{q:1,r:0},{q:1,r:-1},{q:2,r:-1}],
    [{q:0,r:0},{q:1,r:0},{q:2,r:0},{q:1,r:-1},{q:1,r:1}],
    [{q:0,r:0},{q:1,r:0},{q:0,r:1},{q:-1,r:1},{q:1,r:-1}],
    [{q:0,r:0},{q:0,r:1},{q:0,r:2},{q:1,r:1},{q:-1,r:1}],
    [{q:0,r:0},{q:1,r:0},{q:2,r:0},{q:3,r:0},{q:4,r:0}],
  ];

  const COLORS = [
    {fill:"rgba(110,231,255,.85)", stroke:"rgba(110,231,255,.95)"},
    {fill:"rgba(167,139,250,.82)", stroke:"rgba(167,139,250,.95)"},
    {fill:"rgba(52,211,153,.80)", stroke:"rgba(52,211,153,.92)"},
    {fill:"rgba(251,191,36,.82)", stroke:"rgba(251,191,36,.95)"},
    {fill:"rgba(248,113,113,.80)", stroke:"rgba(248,113,113,.92)"},
  ];

  let pieces = [null,null,null];
  let hoverPlacement = null;

  function randInt(n){ return Math.floor(Math.random()*n); }
  function newPiece(){
    const pattern = PATTERNS[randInt(PATTERNS.length)];
    const color = randInt(COLORS.length);
    return { cells: pattern.map(c=>({q:c.q,r:c.r})), color, used:false };
  }

  function updateHUD(){
    scoreEl.textContent = String(score);
    comboEl.textContent = String(combo);
  }

  function pieceAbsCells(piece, anchor){
    return piece.cells.map(c => ({ q: c.q + anchor.q, r: c.r + anchor.r }));
  }

  function canPlace(piece, anchor){
    const abs = pieceAbsCells(piece, anchor);
    for(const c of abs){
      if(!inBoard(c.q,c.r)) return false;
      if(occupied.has(keyOf(c.q,c.r))) return false;
    }
    return true;
  }

  function clearFullLines(){
    let clearedCount = 0;
    const qSet = new Set(), rSet = new Set(), sSet = new Set();
    for(const c of cells){
      qSet.add(c.q); rSet.add(c.r); sSet.add(-c.q-c.r);
    }
    const toClear = new Set();

    for(const q of qSet){
      const line = cells.filter(c => c.q === q);
      if(line.length && line.every(c => occupied.has(keyOf(c.q,c.r)))){
        line.forEach(c => toClear.add(keyOf(c.q,c.r))); clearedCount++;
      }
    }
    for(const r of rSet){
      const line = cells.filter(c => c.r === r);
      if(line.length && line.every(c => occupied.has(keyOf(c.q,c.r)))){
        line.forEach(c => toClear.add(keyOf(c.q,c.r))); clearedCount++;
      }
    }
    for(const s of sSet){
      const line = cells.filter(c => (-c.q-c.r) === s);
      if(line.length && line.every(c => occupied.has(keyOf(c.q,c.r)))){
        line.forEach(c => toClear.add(keyOf(c.q,c.r))); clearedCount++;
      }
    }
    if(toClear.size){
      for(const k of toClear) occupied.delete(k);
    }
    return clearedCount;
  }

  function pieceHasAnyPlacement(piece){
    for(const c of cells){
      if(canPlace(piece, c)) return true;
    }
    return false;
  }

  function anyMovePossible(){
    for(let i=0;i<3;i++){
      const p = pieces[i];
      if(!p || p.used) continue;
      if(pieceHasAnyPlacement(p)) return true;
    }
    return false;
  }

  function refillPieces(){
    for(let i=0;i<3;i++){
      if(!pieces[i] || pieces[i].used) pieces[i] = newPiece();
    }
    if(!anyMovePossible()){
      showOverlay("ゲームオーバー", "どのピースも置ける場所がありません。");
    }
  }

  function placePieceByAnchor(piece, anchor){
    const abs = pieceAbsCells(piece, anchor);
    for(const c of abs) occupied.set(keyOf(c.q,c.r), piece.color);

    score += abs.length * 5;

    const cleared = clearFullLines();
    if(cleared > 0){
      combo += 1;
      score += cleared * 60 + combo * 20;
      hintEl.textContent = `ライン消去！ +${cleared}（コンボ ${combo}）`;
    }else{
      combo = 0;
      hintEl.textContent = "ナイス！";
    }
    updateHUD();
  }

  function resetGame(){
    occupied = new Map();
    score = 0;
    combo = 0;
    hoverPlacement = null;
    for(let i=0;i<3;i++) pieces[i] = newPiece();
    for(let t=0;t<6 && !anyMovePossible();t++){
      for(let i=0;i<3;i++) pieces[i] = newPiece();
    }
    updateHUD();
    hideOverlay();
    hintEl.textContent = "ピースをドラッグして配置（ハイライトはゴースト基準）";
    draw();
    drawTray();
  }

  // ===== Drawing =====
  function draw(){
    const rect = boardWrap.getBoundingClientRect();
    const W = rect.width, H = rect.height;
    bctx.clearRect(0,0,W,H);

    bctx.save();
    bctx.globalAlpha = 0.55;
    bctx.fillStyle = "rgba(255,255,255,.02)";
    bctx.fillRect(0,0,W,H);
    bctx.restore();

    bctx.save();
    bctx.strokeStyle = "rgba(255,255,255,.08)";
    bctx.lineWidth = 2;
    bctx.strokeRect(10,10,W-20,H-20);
    bctx.restore();

    for(const c of cells){
      const p = geom.cellToPix.get(keyOf(c.q,c.r));
      const size = geom.hexSize;
      hexPath(bctx, p.x, p.y, size-0.8);
      bctx.fillStyle = "rgba(255,255,255,.04)";
      bctx.fill();
      bctx.strokeStyle = "rgba(255,255,255,.08)";
      bctx.lineWidth = 1;
      bctx.stroke();
    }

    if(hoverPlacement && hoverPlacement.absCells){
      for(const c of hoverPlacement.absCells){
        const p = geom.cellToPix.get(keyOf(c.q,c.r));
        if(!p) continue;
        const size = geom.hexSize;
        hexPath(bctx, p.x, p.y, size-1.2);
        bctx.fillStyle = hoverPlacement.ok ? "rgba(110,231,255,.18)" : "rgba(255,107,138,.18)";
        bctx.fill();
        bctx.strokeStyle = hoverPlacement.ok ? "rgba(110,231,255,.40)" : "rgba(255,107,138,.40)";
        bctx.lineWidth = 2;
        bctx.stroke();
      }
    }

    for(const [k, colorIdx] of occupied.entries()){
      const p = geom.cellToPix.get(k);
      if(!p) continue;
      const size = geom.hexSize;

      bctx.save();
      bctx.translate(1.2, 1.6);
      hexPath(bctx, p.x, p.y, size-1.1);
      bctx.fillStyle = "rgba(0,0,0,.22)";
      bctx.fill();
      bctx.restore();

      hexPath(bctx, p.x, p.y, size-1.4);
      bctx.fillStyle = COLORS[colorIdx].fill;
      bctx.fill();
      bctx.strokeStyle = COLORS[colorIdx].stroke;
      bctx.lineWidth = 2;
      bctx.stroke();

      hexPath(bctx, p.x, p.y, (size-1.4)*0.62);
      bctx.strokeStyle = "rgba(255,255,255,.10)";
      bctx.lineWidth = 1.2;
      bctx.stroke();
    }
  }

  function drawTray(){
    for(let i=0;i<3;i++){
      const pc = pieceCanvases[i];
      const piece = pieces[i];
      const ctx = pc.ctx;
      const canvas = pc.el;
      ctx.clearRect(0,0,canvas.width, canvas.height);

      if(!piece || piece.used){
        ctx.save();
        ctx.fillStyle = "rgba(233,238,255,.30)";
        ctx.font = "700 12px -apple-system, system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("OK", canvas.width/2, canvas.height/2+4);
        ctx.restore();
        continue;
      }

      const size = 12;
      const SQ3 = Math.sqrt(3);
      const pts = piece.cells.map(c => ({
        x: size*SQ3*(c.q + c.r/2),
        y: size*1.5*c.r
      }));
      let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
      for(const p of pts){
        minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
        minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
      }
      const ox = canvas.width/2 - (minX + maxX)/2;
      const oy = canvas.height/2 - (minY + maxY)/2;

      for(const p0 of pts){
        const x = p0.x + ox;
        const y = p0.y + oy;

        ctx.save();
        ctx.translate(1.2, 1.6);
        hexPath(ctx, x, y, size-0.7);
        ctx.fillStyle = "rgba(0,0,0,.22)";
        ctx.fill();
        ctx.restore();

        hexPath(ctx, x, y, size-1.0);
        ctx.fillStyle = COLORS[piece.color].fill;
        ctx.fill();
        ctx.strokeStyle = COLORS[piece.color].stroke;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

  // =============================
  // Drag: 指ではなく「狙い点（ゴースト基準）」で判定する
  // =============================
  const AIM = {
    offsetY: 150,       // 指から上へ（ゴーストと同じ概念）
    offsetXMag: 70,     // 左右へ逃がす量
    yBias: 0            // さらに微調整したいなら -10 など
  };

  function getAimPoint(clientX, clientY){
    const vw = window.innerWidth || 390;
    const offsetX = (clientX > vw * 0.55) ? -AIM.offsetXMag : AIM.offsetXMag;
    return {
      x: clientX + offsetX,
      y: clientY - AIM.offsetY + AIM.yBias
    };
  }

  // Ghost（表示位置）は今まで通り“見やすい場所”へ
  function moveGhost(clientX, clientY){
    const vw = window.innerWidth || 390;
    const offsetX = (clientX > vw * 0.55) ? -AIM.offsetXMag : AIM.offsetXMag;

    const halfW = 70;   // ghost(140px)半分
    const tweakY = 90;

    const x = clientX + offsetX - halfW;
    const y = clientY - AIM.offsetY - tweakY;

    ghost.style.transform = `translate(${x}px, ${y}px)`;
  }

  // ===== Ghost drawing =====
  let drag = { active:false, slot:-1, pointerId:null, lastX:0, lastY:0 };

  function showGhostForPiece(piece){
    ghost.style.display = "block";
    gctx.clearRect(0,0,ghostCanvas.width, ghostCanvas.height);

    const size = 22;
    const SQ3 = Math.sqrt(3);
    const pts = piece.cells.map(c => ({
      x: size*SQ3*(c.q + c.r/2),
      y: size*1.5*c.r
    }));
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    for(const p of pts){
      minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
      minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
    }
    const ox = ghostCanvas.width/2 - (minX + maxX)/2;
    const oy = ghostCanvas.height/2 - (minY + maxY)/2;

    for(const p0 of pts){
      const x = p0.x + ox;
      const y = p0.y + oy;

      gctx.save();
      gctx.translate(1.6, 2.2);
      hexPath(gctx, x, y, size-0.7);
      gctx.fillStyle = "rgba(0,0,0,.22)";
      gctx.fill();
      gctx.restore();

      hexPath(gctx, x, y, size-1.0);
      gctx.fillStyle = COLORS[piece.color].fill;
      gctx.fill();
      gctx.strokeStyle = COLORS[piece.color].stroke;
      gctx.lineWidth = 2.5;
      gctx.stroke();
    }
  }

  function hideGhost(){
    ghost.style.display = "none";
    ghost.style.transform = `translate(-9999px,-9999px)`;
  }

  function boardCellFromClientXY(clientX, clientY){
    const rect = boardCanvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const localX = x - geom.originX;
    const localY = y - geom.originY;
    return geom.pixToCell(localX, localY);
  }

  function updatePreviewByAim(piece, fingerX, fingerY){
    const aim = getAimPoint(fingerX, fingerY);
    const cell = boardCellFromClientXY(aim.x, aim.y);
    if(!cell){ hoverPlacement = null; draw(); return; }
    const abs = pieceAbsCells(piece, cell);
    const ok = canPlace(piece, cell);
    hoverPlacement = { anchorCell: cell, ok, absCells: abs };
    draw();
  }

  function tryDropByAim(piece, fingerX, fingerY){
    const aim = getAimPoint(fingerX, fingerY);
    const cell = boardCellFromClientXY(aim.x, aim.y);
    if(!cell) return false;

    const tries = [{q:0,r:0}, ...dirs];
    for(const d of tries){
      const a = {q: cell.q + d.q, r: cell.r + d.r};
      if(canPlace(piece, a)){
        placePieceByAnchor(piece, a);
        return true;
      }
    }
    return false;
  }

  // ★ドラッグ開始時：盤面中央を“最初のハイライト”にする
  function highlightBoardCenter(piece){
    const rect = boardCanvas.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    const cell = boardCellFromClientXY(cx, cy);
    if(!cell){ hoverPlacement = null; draw(); return; }
    const abs = pieceAbsCells(piece, cell);
    const ok = canPlace(piece, cell);
    hoverPlacement = { anchorCell: cell, ok, absCells: abs };
    draw();
  }

  function onSlotPointerDown(e, slotIndex){
    const piece = pieces[slotIndex];
    if(!piece || piece.used) return;

    drag.active = true;
    drag.slot = slotIndex;
    drag.pointerId = e.pointerId;
    drag.lastX = e.clientX;
    drag.lastY = e.clientY;

    e.currentTarget.setPointerCapture(e.pointerId);

    showGhostForPiece(piece);
    moveGhost(e.clientX, e.clientY);

    // 初期ハイライトは盤面中央
    highlightBoardCenter(piece);

    hintEl.textContent = "（ハイライトはゴースト基準）盤面で指を離すと配置";
  }

  function onSlotPointerMove(e){
    if(!drag.active || e.pointerId !== drag.pointerId) return;
    drag.lastX = e.clientX;
    drag.lastY = e.clientY;

    const piece = pieces[drag.slot];
    if(!piece || piece.used) return;

    // 表示（ゴースト）更新
    moveGhost(e.clientX, e.clientY);

    // 判定/ハイライトは「狙い点」で更新（指の直下ではない）
    updatePreviewByAim(piece, e.clientX, e.clientY);
  }

  function endDrag(e){
    if(!drag.active || e.pointerId !== drag.pointerId) return;

    const piece = pieces[drag.slot];
    let placed = false;

    if(piece && !piece.used){
      placed = tryDropByAim(piece, drag.lastX, drag.lastY);
      if(placed){
        piece.used = true;
        refillPieces();
        drawTray();
        draw();
      }else{
        hintEl.textContent = "そこには置けません（空き＆盤面内が必要）";
      }
    }

    hoverPlacement = null;
    draw();
    hideGhost();

    drag.active = false;
    drag.slot = -1;
    drag.pointerId = null;

    if(placed) hintEl.textContent = "ピースをドラッグして配置（ハイライトはゴースト基準）";
  }

  // attach to slots
  slotEls.forEach((el) => {
    const idx = Number(el.dataset.slot);
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); onSlotPointerDown(e, idx); });
    el.addEventListener('pointermove', (e) => { e.preventDefault(); onSlotPointerMove(e); });
    el.addEventListener('pointerup',   (e) => { e.preventDefault(); endDrag(e); });
    el.addEventListener('pointercancel',(e)=> { e.preventDefault(); endDrag(e); });
  });

  // keep updating while dragging
  window.addEventListener('pointermove', (e) => {
    if(!drag.active) return;
    const piece = pieces[drag.slot];
    if(!piece || piece.used) return;
    drag.lastX = e.clientX; drag.lastY = e.clientY;
    moveGhost(e.clientX, e.clientY);
    updatePreviewByAim(piece, e.clientX, e.clientY);
  }, {passive:false});

  window.addEventListener('pointerup', (e) => {
    if(drag.active) endDrag(e);
  }, {passive:false});

  // ===== Overlay / Restart =====
  function showOverlay(title, text){
    ovTitle.textContent = title;
    ovText.textContent = text;
    overlay.classList.add('show');
  }
  function hideOverlay(){ overlay.classList.remove('show'); }

  ovRestart.addEventListener('click', resetGame);
  ovClose.addEventListener('click', hideOverlay);
  restartBtn.addEventListener('click', resetGame);

  // ===== Resize / Init =====
  function lockViewport(){
    document.documentElement.style.height = "100%";
    document.body.style.height = "100%";
  }
  window.addEventListener('resize', () => {
    lockViewport();
    resizeBoard();
  });

  // ===== init pieces =====
  function initPieces(){
    pieces = [newPiece(), newPiece(), newPiece()];
    for(let t=0;t<6 && !anyMovePossible();t++){
      pieces = [newPiece(), newPiece(), newPiece()];
    }
  }

  lockViewport();
  resizeBoard();
  initPieces();
  updateHUD();
  draw();
  drawTray();

  // start game on load
  function startNew(){
    resetGame();
  }

})();
</script>
</body>
